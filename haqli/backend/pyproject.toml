[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "haqli-backend"
version = "2.1.0"
description = "Haqli — Citizen-first Uzbekistan LegalTech FastAPI Backend, Deterministic Rules & Recognition Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.2",
    "reportlab>=4.2.5",
    "qrcode[pil]>=8.0",
    "pillow>=10.4.0",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
]
postgres = [
    "asyncpg>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
