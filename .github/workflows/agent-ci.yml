# Lint, tests and a retrieval-quality gate for the legal agent (agent/).
name: agent-ci

on:
  push:
    paths: ["agent/**", ".github/workflows/agent-ci.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agent
    env:
      LLM_PROVIDER: mock
      LEX_UZ_ENABLE_LIVE_FALLBACK: "false"
      WARMUP_ON_START: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check lex_agent scripts tests --select E9,F
      - name: Unit, route and API tests
        run: python -m pytest -q -p no:warnings
      - name: Build the index from the bundled corpora
        run: lex-agent build-index --force
      - name: Retrieval quality gate
        run: |
          lex-agent eval --split test --json-out eval-test.json > /dev/null
          lex-agent eval --split holdout2 --json-out eval-holdout2.json > /dev/null
          python scripts/check_eval.py eval-test.json --min-hit1 0.88 --min-hit5 0.97 --max-p95-ms 400
          python scripts/check_eval.py eval-holdout2.json --min-hit1 0.60 --min-hit5 0.85
      - name: Live server - SSE contract smoke test and a short load test (zero errors allowed)
        run: |
          uvicorn lex_agent.api.app:app --host 127.0.0.1 --port 8000 --log-level warning > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
          python scripts/sse_smoke.py http://127.0.0.1:8000
          python scripts/load_test.py http://127.0.0.1:8000 --users 20 --duration 20 --stream 0.5 \
            --pid "$SERVER_PID" --max-error-rate 0 --json-out load-test.json
          kill "$SERVER_PID"
          if grep -q "Traceback" server.log; then cat server.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: |
            agent/eval-*.json
            agent/load-test.json
            agent/server.log
          if-no-files-found: ignore

  docker:
    # The production image exactly as Render builds it, run with the Render Starter memory limit
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the image
        run: docker build -t lex-agent:ci agent
      - name: Start a container limited to 512 MB
        run: |
          docker run -d --name lex-agent -p 8000:8000 --memory 512m \
            -e LLM_PROVIDER=mock -e LEX_UZ_ENABLE_LIVE_FALLBACK=false lex-agent:ci
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8000/api/health > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/health
      - name: SSE smoke test and load test against the container
        run: |
          pip install "httpx>=0.27.2"
          python agent/scripts/sse_smoke.py http://127.0.0.1:8000
          python agent/scripts/load_test.py http://127.0.0.1:8000 --users 30 --duration 30 --stream 0.5 --max-error-rate 0
          docker stats --no-stream lex-agent
          test "$(docker inspect -f '{{.State.OOMKilled}}' lex-agent)" = "false"
          test "$(docker inspect -f '{{.State.Running}}' lex-agent)" = "true"
          if docker logs lex-agent 2>&1 | grep -q "Traceback"; then exit 1; fi
      - name: Container logs
        if: always()
        run: docker logs lex-agent 2>&1 | tail -n 200
