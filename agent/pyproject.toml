[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-uz-agent"
version = "1.0.0"
description = "Production-grade multilingual Legal AI Agent for all legislation of the Republic of Uzbekistan (Lex.uz - UZ/RU/EN)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "qdrant-client>=1.12.0",
    "rank-bm25>=0.2.2",
    "openai>=1.55.0",
    "tenacity>=9.0.0",
    "rich>=13.9.0",
    "typer>=0.13.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.2.0",
    "torch>=2.4.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.26.0",
    "pyarrow>=17.0.0",
]
browser = [
    "playwright>=1.48.0",
]
docs = [
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[project.scripts]
lex-agent = "lex_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["lex_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
